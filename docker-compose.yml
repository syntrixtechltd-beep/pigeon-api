services:
  app:
    build: .
    ports: ["8080:80"]
    env_file: .env
    depends_on: [db]
    volumes:
      - .:/var/www/html
      - vendor:/var/www/html/vendor
  db:
    image: mariadb:11
    ports: ["3307:3306"]
    environment:
      MYSQL_ROOT_PASSWORD: secret
    volumes:
      - dbdata:/var/lib/mysql
      - ./va-api.sql:/docker-entrypoint-initdb.d/init.sql
volumes:
  dbdata:
  vendor:
