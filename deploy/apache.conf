ServerTokens Prod
ServerSignature Off

# The document root is the project root, so no file other than the front controller may be served.
# This keeps .env, logs, vendor/ and the worker scripts private; routes that are not files still reach index.php via .htaccess.
<Directory /var/www/html>
    Options -Indexes
    AllowOverride All
    <If "-f %{REQUEST_FILENAME} && %{REQUEST_FILENAME} != '/var/www/html/index.php'">
        Require all denied
    </If>
</Directory>
